function key(g){return g.away+' @ '+g.home}
function fmt(x){if(x===null||x===undefined)return '—';x=Number(x);return x>0?'+'+x:String(x)}
function season(a){let z=[];for(let w=1;w<=18;w++){for(const g of SCHEDULE[String(w)]||[]){if(g.awayAbbr===a){z.push({w:w,t:'@ '+g.homeAbbr});break}if(g.homeAbbr===a){z.push({w:w,t:'vs '+g.awayAbbr});break}}}return z}
function gameForTeam(a){return (SCHEDULE[String(week)]||[]).find(g=>g.awayAbbr===a||g.homeAbbr===a)}
function isATS(){return P().type==='ats_all'||P().type==='ats_limited'}
function limitForWeek(){if(P().type==='ats_all')return (SCHEDULE[String(week)]||[]).length;return Number(P().picksPerWeek)}
function pickLine(a){
  let g=gameForTeam(a),og=g&&odds.games[key(g)]; if(!g||!og)return null;
  return a===g.awayAbbr?og.away:og.home;
}
function capturedLine(a){let d=P().captured[week]||{};return d[a]}
function setCaptured(a,val){P().captured[week]=P().captured[week]||{};if(val===undefined||val===null)delete P().captured[week][a];else P().captured[week][a]=val}
function select(a){
  let p=P(),x=wp().slice(),m=Number(p.maxUses),lim=limitForWeek(),g=gameForTeam(a);
  if(x.includes(a)){x=x.filter(v=>v!==a);setCaptured(a,null)}
  else{
    if(isATS()&&g){
      let opp=a===g.awayAbbr?g.homeAbbr:g.awayAbbr;
      if(x.includes(opp)){x=x.filter(v=>v!==opp);setCaptured(opp,null)}
    }
    if(!isATS()&&m<99&&count(a)>=m){alert(a+' has reached the pool limit of '+m+'.');return}
    if(p.type==='limited'&&lim===1)x=[a];
    else if(lim>=99||x.length<lim)x.push(a);
    else{alert('This pool allows '+lim+' picks per week.');return}
    if(isATS())setCaptured(a,pickLine(a))
  }
  if(x.length)p.picks[week]=x;else delete p.picks[week];
  save();render()
}
function teams(){
  let g=document.getElementById('grid');g.innerHTML='';
  for(const t of TEAMS){
    let k=count(t.abbr),m=Number(P().maxUses),d=document.createElement('div');
    d.className='chip'+(!isATS()&&m<99&&k===m?' max':'');d.style.background=t.color;d.innerHTML=t.abbr+'<span>'+k+'</span>';g.appendChild(d)
  }
  let leg=document.getElementById('legend');
  if(isATS())leg.textContent='Numbers = selections this season';
  else leg.textContent=(Number(P().maxUses)>=99?'Unlimited':'Max '+P().maxUses+' per team')+' · amber = limit';
}
function games(){
  let box=document.getElementById('games');box.innerHTML='';let chosen=wp(),p=P();
  for(const g of SCHEDULE[String(week)]||[]){
    let og=odds.games[key(g)],d=document.createElement('div');d.className='game';
    let line=og?(g.awayAbbr+' '+fmt(og.away)+' / '+g.homeAbbr+' '+fmt(og.home)):'Not posted';
    d.innerHTML='<div class="meta"><b>'+g.date+'</b><br>'+g.time+'</div><div class="tw"><button class="team '+(chosen.includes(g.awayAbbr)?'sel':'')+'" data-a="'+g.awayAbbr+'" style="background:'+c(g.awayAbbr)+'">'+g.awayAbbr+'</button><button class="info" data-i="'+g.awayAbbr+'">ⓘ</button></div><div class="at">@</div><div class="tw"><button class="team '+(chosen.includes(g.homeAbbr)?'sel':'')+'" data-a="'+g.homeAbbr+'" style="background:'+c(g.homeAbbr)+'">'+g.homeAbbr+'</button><button class="info" data-i="'+g.homeAbbr+'">ⓘ</button></div><div class="spread" style="'+(p.spreadMode==='off'?'display:none':'')+'">Spread<b>'+line+'</b>'+(og?'<small>'+og.source+'</small>':'')+'</div><div class="future"></div>';
    d.querySelectorAll('.team').forEach(b=>b.onclick=()=>select(b.dataset.a));
    d.querySelectorAll('.info').forEach(b=>b.onclick=()=>{
      let a=b.dataset.i,f=d.querySelector('.future'),z=season(a),was=f.classList.contains('show');
      f.innerHTML='<b>'+n(a)+'</b> — '+count(a)+' used'+(!isATS()?' / '+(Number(p.maxUses)>=99?'∞':p.maxUses)+' allowed':'')+'<div class="season-strip">'+z.map(x=>'<div class="sg '+(x.w===week?'current':'')+'"><span class="w">W'+x.w+'</span>'+x.t+'</div>').join('')+'</div>';
      f.classList.toggle('show');
      if(!was&&f.classList.contains('show'))setTimeout(()=>{let s=f.querySelector('.season-strip'),cur=f.querySelector('.sg.current');if(s&&cur)s.scrollLeft=Math.max(0,cur.offsetLeft-s.clientWidth/2+cur.clientWidth/2)},0)
    });
    box.appendChild(d)
  }
}
function typeLabel(){
  let p=P();
  if(p.type==='limited')return 'Limited Pick'+(Number(p.picksPerWeek)===1?' (Suicide)':'');
  if(p.type==='ats_all')return 'Against the Spread — All';
  if(p.type==='ats_limited')return 'Against the Spread — Limited';
  return 'Custom';
}
function render(){
  refreshPoolSelect();
  let s=document.getElementById('summary'),x=wp(),p=P(),txt='';
  if(isATS()){
    let lim=limitForWeek(),items=x.map(a=>a+(capturedLine(a)!==undefined?' ('+fmt(capturedLine(a))+')':''));
    txt='<b>'+p.name+' · Week '+week+':</b> '+x.length+' / '+lim+' picked'+(items.length?'<br>'+items.join(', '):'');
  }else{
    txt=x.length?'<b>'+p.name+' · Week '+week+' pick'+(x.length>1?'s':'')+':</b> '+x.join(', '):'<b>'+p.name+'</b> · '+typeLabel();
  }
  s.innerHTML=txt;games();teams()
}
async function loadOdds(){
  try{
    let u='https://raw.githubusercontent.com/MGMunro52/NFL-PickAll-2026/main/odds.json?'+Date.now(),r=await fetch(u,{cache:'no-store'});
    if(!r.ok)throw new Error('odds fetch '+r.status);odds=await r.json();games()
  }catch(e){
    try{let r=await fetch('odds.json?'+Date.now(),{cache:'no-store'});if(r.ok){odds=await r.json();games()}}catch(_){}
  }
}
ws.onchange=()=>{week=Number(ws.value);save();render()};
document.getElementById('prev').onclick=()=>{if(week>1){week--;ws.value=week;save();render()}};
document.getElementById('next').onclick=()=>{if(week<18){week++;ws.value=week;save();render()}};
document.getElementById('clear').onclick=()=>{delete P().picks[week];delete P().captured[week];save();render()};
document.getElementById('reset').onclick=()=>{if(confirm('Clear all picks in '+P().name+'?')){P().picks={};P().captured={};save();render()}};
poolSel.onchange=()=>{activeId=poolSel.value;save();render()};
document.getElementById('newPool').onclick=()=>{
  let name=prompt('Name the new pool:','New Pool');if(!name)return;
  let p={id:makeId(),name:name.trim()||'New Pool',type:'limited',maxUses:3,picksPerWeek:1,spreadMode:'auto',picks:{},captured:{}};
  pools.push(p);activeId=p.id;save();render();openRules()
};
const dr=document.getElementById('drawer'),mu=document.getElementById('maxUses'),pp=document.getElementById('ppw'),sm=document.getElementById('spreadMode'),pt=document.getElementById('poolType'),pn=document.getElementById('poolName'),maxRow=document.getElementById('maxRow'),ppwRow=document.getElementById('ppwRow'),hint=document.getElementById('ruleHint');
function ruleUI(){
  let t=pt.value;
  maxRow.classList.toggle('disabled',t==='ats_all'||t==='ats_limited');
  mu.disabled=t==='ats_all'||t==='ats_limited';
  ppwRow.classList.toggle('disabled',t==='ats_all');
  pp.disabled=t==='ats_all';
  if(t==='limited')hint.textContent='One pick per week is the usual “Suicide” format.';
  else if(t==='ats_all')hint.textContent='Choose one side in every game. The spread is captured when you make each pick.';
  else if(t==='ats_limited')hint.textContent='Choose a fixed number of games against the spread. One side per game.';
  else hint.textContent='Set the weekly pick limit and team-use limit independently.';
}
function openRules(){
  let p=P();pn.value=p.name;pt.value=p.type;mu.value=p.maxUses;pp.value=p.picksPerWeek;sm.value=p.spreadMode;ruleUI();document.getElementById('deletePool').style.display=pools.length>1?'block':'none';dr.classList.add('show')
}
document.getElementById('rules').onclick=openRules;
pt.onchange=()=>{
  if(pt.value==='ats_all'){mu.value=99;pp.value=99}
  else if(pt.value==='ats_limited'){mu.value=99;if(Number(pp.value)>=99)pp.value=3}
  ruleUI()
};
document.getElementById('done').onclick=()=>{
  let p=P();p.name=pn.value.trim()||'My Pool';p.type=pt.value;p.maxUses=Number(mu.value);p.picksPerWeek=Number(pp.value);p.spreadMode=sm.value;
  if(p.type==='ats_all'){p.maxUses=99;p.picksPerWeek=99}
  if(p.type==='ats_limited')p.maxUses=99;
  save();dr.classList.remove('show');render()
};
document.getElementById('deletePool').onclick=()=>{
  if(pools.length<=1)return;
  if(confirm('Delete '+P().name+' and all of its picks?')){pools=pools.filter(p=>p.id!==activeId);activeId=pools[0].id;save();dr.classList.remove('show');render()}
};
dr.onclick=e=>{if(e.target===dr)dr.classList.remove('show')};
refreshPoolSelect();render();loadOdds();
</script></body></html>
