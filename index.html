<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b172a">
<title>NFL 2026 PickAll</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
 --bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;
 --navy:#0b172a;--good:#dcfce7;--warn:#fde68a;--bad:#fecaca;--blue:#dbeafe
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}
.app{height:100dvh;display:grid;grid-template-rows:minmax(0,2fr) minmax(190px,1fr)}
.top{overflow:auto;padding:9px}
.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:6px;padding:0 0 8px}
.toolbar select,.toolbar button,.toolbar input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px}
#week{font-weight:700;min-width:110px}
.spacer{flex:1}
.iconbtn{min-width:40px}
.games{display:grid;gap:7px}
.game{
 background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;
 display:grid;grid-template-columns:65px 1fr 18px 1fr 68px;gap:6px;align-items:center
}
.meta{font-size:11px;color:var(--muted);line-height:1.25}
.team{
 min-height:46px;color:#fff;font-weight:700;font-size:17px;border:2px solid transparent;border-radius:9px;padding:6px 4px
}
.team.sel{outline:4px solid #111827;outline-offset:1px}
.at{text-align:center;font-weight:700;color:var(--muted)}
.spreadWrap{text-align:center}
.spreadWrap label{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.spread{width:64px;border:1px solid var(--line);border-radius:7px;padding:7px 4px;text-align:center;background:#fff}
.future{grid-column:2/6;font-size:11px;color:#374151;background:#f9fafb;border-radius:7px;padding:5px 7px;display:none}
.future.show{display:block}
.bottom{background:#fff;border-top:2px solid var(--navy);padding:7px 8px max(7px,env(safe-area-inset-bottom));overflow:auto}
.bottomHead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bottomHead .title{font-weight:700}
.legend{font-size:10px;color:var(--muted)}
.bottomHead .right{margin-left:auto;display:flex;gap:5px}
.bottomHead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px}
.teamGrid{display:grid;grid-template-columns:repeat(8,minmax(38px,1fr));gap:4px}
.chip{
 border-radius:8px;padding:5px 1px;color:#fff;text-align:center;font-weight:700;font-size:11px;min-height:39px;
 display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(0,0,0,.15)
}
.chip .count{font-size:14px;margin-top:1px}
.chip.used{opacity:.86}.chip.maxed{box-shadow:inset 0 0 0 3px #f59e0b}.chip.over{box-shadow:inset 0 0 0 3px #ef4444}
.drawer{
 position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:none;align-items:flex-end
}
.drawer.show{display:flex}
.panel{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 15px max(20px,env(safe-area-inset-bottom));box-shadow:0 -5px 25px rgba(0,0,0,.18)}
.panel h3{margin:0 0 14px}
.settingRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #e5e7eb}
.settingRow select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.pickSummary{font-size:12px;background:#eff6ff;padding:8px;border-radius:9px;margin-bottom:7px;display:none}
.pickSummary.show{display:block}
@media(max-width:700px){
 .app{grid-template-rows:minmax(0,67vh) minmax(0,33vh)}
 .game{grid-template-columns:54px 1fr 14px 1fr 58px;padding:7px;gap:4px}
 .team{font-size:15px;min-height:43px}.spread{width:55px;padding:6px 2px}
 .teamGrid{grid-template-columns:repeat(8,1fr);gap:3px}.chip{font-size:10px;min-height:37px;padding:4px 1px}.chip .count{font-size:13px}
}
@media(min-width:900px){
 .games{grid-template-columns:1fr 1fr}.teamGrid{grid-template-columns:repeat(16,1fr)}
 .panel{max-width:560px;margin:0 auto 20px;border-radius:18px}
 .drawer{align-items:center}
}
</style>
</head>
<body>
<div class="app">
 <section class="top">
  <div class="toolbar">
   <select id="week"></select>
   <button class="iconbtn" id="prev">◀</button><button class="iconbtn" id="next">▶</button>
   <div class="spacer"></div>
   <button id="settings">⚙︎ Rules</button>
  </div>
  <div id="summary" class="pickSummary"></div>
  <div id="games" class="games"></div>
 </section>
 <section class="bottom">
  <div class="bottomHead">
   <div><div class="title">Season picks</div><div id="legend" class="legend"></div></div>
   <div class="right"><button id="clearWeek">Clear week</button><button id="reset">Reset all</button></div>
  </div>
  <div id="teamGrid" class="teamGrid"></div>
 </section>
</div>

<div id="drawer" class="drawer">
 <div class="panel">
  <h3>Pool rules</h3>
  <div class="settingRow"><span>Maximum uses per team</span>
    <select id="maxUses"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option value="99">Unlimited</option></select>
  </div>
  <div class="settingRow"><span>Show point-spread entry</span>
    <select id="showSpread"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>
  <div class="settingRow"><span>Show future opponents on team tap</span>
    <select id="showFuture"><option value="yes">Yes</option><option value="no">No</option></select>
  </div>
  <button id="done" style="width:100%;margin-top:14px;border:0;border-radius:10px;background:#0b172a;color:white;padding:11px;font-weight:700">Done</button>
 </div>
</div>

function save(){
 localStorage.setItem(PICKKEY,JSON.stringify(picks));localStorage.setItem(SPREADKEY,JSON.stringify(spreads));
 localStorage.setItem(SETTINGSKEY,JSON.stringify(settings));localStorage.setItem("nfl2026PickAll_v2_week",String(week))
}
function color(a){return (TEAMS.find(t=>t.abbr===a)||{}).color||"#374151"}
function teamName(a){return (TEAMS.find(t=>t.abbr===a)||{}).name||a}
function count(a){return Object.values(picks).filter(x=>x===a).length}
function maxLabel(){return Number(settings.maxUses)>=99?"Unlimited":settings.maxUses}
function canPick(a,current){
 const max=Number(settings.maxUses); return max>=99 || current===a || count(a)<max
}
function futureOpponents(a,fromWeek){
 let out=[];
 for(let w=fromWeek+1;w<=18;w++){
  for(const g of (SCHEDULE[String(w)]||[])){
   if(g.awayAbbr===a){out.push(`W${w} @ ${g.homeAbbr}`);break}
   if(g.homeAbbr===a){out.push(`W${w} vs ${g.awayAbbr}`);break}
  }
  if(out.length>=5) break
 }
 return out.join(" · ")
}
function renderGrid(){
 const grid=document.getElementById("teamGrid");grid.innerHTML="";
 for(const t of TEAMS){
  const c=count(t.abbr),max=Number(settings.maxUses);
  const d=document.createElement("div");
  d.className="chip"+(c>0?" used":"")+(max<99&&c===max?" maxed":"")+(max<99&&c>max?" over":"");
  d.style.background=t.color;d.title=t.name;
  d.innerHTML=`<div>${t.abbr}</div><div class="count">${c}</div>`;
  grid.appendChild(d)
 }
 document.getElementById("legend").textContent=(Number(settings.maxUses)>=99?"Unlimited team use":`Maximum ${settings.maxUses} use${Number(settings.maxUses)===1?"":"s"} per team`)+" · amber = limit";
}
function renderSummary(){
 let chosen=[];
 for(const [k,a] of Object.entries(picks)){if(k.startsWith(week+"-"))chosen.push(a)}
 const el=document.getElementById("summary");
 if(chosen.length){el.className="pickSummary show";el.textContent="Week "+week+" selected: "+chosen.join(", ")}
 else {el.className="pickSummary";el.textContent=""}
}
function renderGames(){
 const wrap=document.getElementById("games");wrap.innerHTML="";
 (SCHEDULE[String(week)]||[]).forEach((g,i)=>{
  const key=week+"-"+i,sel=picks[key]||"";
  const d=document.createElement("div");d.className="game";
  d.innerHTML=`
   <div class="meta"><b>${g.date}</b><br>${g.time}</div>
   <button class="team ${sel===g.awayAbbr?"sel":""}" data-a="${g.awayAbbr}" style="background:${color(g.awayAbbr)}">${g.awayAbbr}</button>
   <div class="at">@</div>
   <button class="team ${sel===g.homeAbbr?"sel":""}" data-a="${g.homeAbbr}" style="background:${color(g.homeAbbr)}">${g.homeAbbr}</button>
   <div class="spreadWrap" style="${settings.showSpread==="yes"?"":"display:none"}"><label>Spread</label><input class="spread" inputmode="decimal" placeholder="±" value="${spreads[key]||""}"></div>
   <div class="future"></div>`;
  d.querySelectorAll(".team").forEach(b=>b.onclick=()=>{
   const a=b.dataset.a;
   if(settings.showFuture==="yes"){
    const f=d.querySelector(".future"),txt=futureOpponents(a,week);
    f.textContent=teamName(a)+": "+(txt||"No later regular-season games");f.classList.toggle("show",!f.classList.contains("show"));
   }
   if(picks[key]===a){delete picks[key]}
   else if(canPick(a,picks[key])){picks[key]=a}
   else {alert(a+" has already reached the pool limit of "+maxLabel()+".");return}
   save();renderGames();renderGrid();renderSummary()
  });
  const inp=d.querySelector(".spread");
  inp.onchange=()=>{const v=inp.value.trim();if(v)spreads[key]=v;else delete spreads[key];save()};
  wrap.appendChild(d)
 });
}
weekSel.onchange=()=>{week=Number(weekSel.value);save();renderGames();renderSummary()};
document.getElementById("prev").onclick=()=>{if(week>1){week--;weekSel.value=week;save();renderGames();renderSummary()}};
document.getElementById("next").onclick=()=>{if(week<18){week++;weekSel.value=week;save();renderGames();renderSummary()}};
document.getElementById("clearWeek").onclick=()=>{Object.keys(picks).filter(k=>k.startsWith(week+"-")).forEach(k=>delete picks[k]);save();renderGames();renderGrid();renderSummary()};
document.getElementById("reset").onclick=()=>{if(confirm("Clear all picks and point spreads?")){picks={};spreads={};save();renderGames();renderGrid();renderSummary()}};

const drawer=document.getElementById("drawer"),maxUses=document.getElementById("maxUses"),showSpread=document.getElementById("showSpread"),showFuture=document.getElementById("showFuture");
function syncSettingsUI(){maxUses.value=String(settings.maxUses);showSpread.value=settings.showSpread;showFuture.value=settings.showFuture}
document.getElementById("settings").onclick=()=>{syncSettingsUI();drawer.classList.add("show")};
document.getElementById("done").onclick=()=>{settings.maxUses=Number(maxUses.value);settings.showSpread=showSpread.value;settings.showFuture=showFuture.value;save();drawer.classList.remove("show");renderGames();renderGrid()};
drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove("show")};

renderGames();renderGrid();renderSummary();
</script>
</body></html>
